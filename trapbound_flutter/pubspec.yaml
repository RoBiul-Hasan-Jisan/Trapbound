name: trapbound
description: Trapbound - a trap-filled platformer (Flutter port of the Phaser/TypeScript game).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Optional: bundle the Nunito font for the exact original look.
  # Put Nunito-SemiBold/Bold/ExtraBold .ttf files in assets/fonts/ and uncomment:
  # fonts:
  #   - family: Nunito
  #     fonts:
  #       - asset: assets/fonts/Nunito-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Nunito-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Nunito-ExtraBold.ttf
  #         weight: 800
