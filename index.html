<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Trapbound</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4a3d82">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'%3E%3Crect width='24' height='32' rx='6' fill='%232a2547'/%3E%3Cg stroke='%23ffe3b0' stroke-width='3' fill='%23ffe3b0'%3E%3Ccircle cx='12' cy='6' r='5.5'/%3E%3Cpath d='M12 11V21M12 12L6 20M12 12L18 20M12 21L8 31M12 21L16 31' fill='none'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--ink:#fdf6ff;--line:rgba(255,255,255,.3);--glass:rgba(255,255,255,.14);--glass-on:rgba(255,158,181,.42);
  --font:Nunito,Quicksand,'Trebuchet MS',ui-rounded,system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
/* Same gradient as the in-game sky, so the letterbox edges blend in */
html{background:#7656a6 linear-gradient(180deg,#4a3d82 0%,#7656a6 55%,#a56fa8 100%) no-repeat;background-size:100% 100%}
body{background:transparent}
#game{position:fixed;inset:0;height:100dvh}
#tc{display:none;position:fixed;left:0;right:0;bottom:0;box-sizing:border-box;
  padding:0 max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  justify-content:space-between;align-items:flex-end;pointer-events:none}
#pad{pointer-events:auto;display:flex;width:210px;height:92px;border-radius:46px;border:1.5px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 10px 28px rgba(20,10,40,.35),inset 0 1px 0 rgba(255,255,255,.25);touch-action:none;overflow:hidden;position:relative}
#pad::after{content:"";position:absolute;left:50%;top:22%;bottom:22%;width:1.5px;background:rgba(255,255,255,.18);border-radius:2px}
#pad span{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink);font:700 28px var(--font);transition:background .12s,transform .12s}
#pad[data-d=l] .l,#pad[data-d=r] .r{background:var(--glass-on)}
#pad[data-d=l] .l{transform:scale(.97)}#pad[data-d=r] .r{transform:scale(.97)}
#bj{pointer-events:auto;width:100px;height:100px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);color:#3b2d5c;font:800 32px var(--font);
  background:linear-gradient(160deg,#ffd0b0,#ff9eb5);box-shadow:0 10px 28px rgba(20,10,40,.38),inset 0 2px 0 rgba(255,255,255,.55);
  touch-action:none;transition:transform .1s,filter .1s}
#bj.on{transform:scale(.92);filter:brightness(1.08) saturate(1.1)}
#rot{display:none;position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);white-space:nowrap;
  padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:rgba(27,21,48,.45);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#e6dcf5;font:700 13px var(--font);pointer-events:none}
#rot i{display:inline-block;font-style:normal;margin-right:6px;animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rot i{animation:none}}
@media (pointer:coarse){#tc{display:flex}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
@media (pointer:coarse) and (orientation:landscape){
  #game{left:calc(142px + env(safe-area-inset-left));right:calc(142px + env(safe-area-inset-right))}
  #pad{width:124px;height:76px;border-radius:38px}#pad span{font-size:24px}#bj{width:88px;height:88px;font-size:28px}}
</style></head><body>
<div id="game"></div><div id="rot"><i>↻</i>rotate your phone for a bigger view</div>
<div id="tc"><div id="pad"><span class="l">◀</span><span class="r">▶</span></div><button id="bj" aria-label="Jump">▲</button></div>
<script type="module" src="/src/main.ts"></script></body></html>
