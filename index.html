<!doctype html><html><head><meta charset="utf-8"><title>TRAPBOUND</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'%3E%3Crect width='24' height='32' fill='%230e0e12'/%3E%3Cg stroke='%23ffe066' stroke-width='3' fill='%23ffe066'%3E%3Ccircle cx='12' cy='6' r='5.5'/%3E%3Cpath d='M12 11V21M12 12L6 20M12 12L18 20M12 21L8 31M12 21L16 31' fill='none'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0e0e12">
<style>
html,body{margin:0;height:100%;background:#0e0e12;overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;height:100dvh}
#tc{display:none;position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom));justify-content:space-between;align-items:flex-end;pointer-events:none}
#pad{pointer-events:auto;display:flex;width:200px;height:88px;border-radius:44px;border:2px solid #ffffff44;background:#ffffff18;touch-action:none;overflow:hidden}
#pad span{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font:30px monospace}
#pad[data-d=l] .l,#pad[data-d=r] .r{background:#ffffff44}
#bj{pointer-events:auto;width:96px;height:96px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff22;color:#fff;font-size:34px;touch-action:none}
#bj.on{background:#ffffff55}
#rot{display:none;position:fixed;top:6px;left:0;right:0;text-align:center;color:#8a8aa0;font:13px monospace;pointer-events:none}
@media (pointer:coarse){#tc{display:flex}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
@media (pointer:coarse) and (orientation:landscape){#game{left:calc(136px + env(safe-area-inset-left));right:calc(136px + env(safe-area-inset-right))}#pad{width:120px;height:72px;border-radius:36px}#pad span{font-size:24px}#bj{width:84px;height:84px}}
</style></head><body>
<div id="game"></div><div id="rot">↻ rotate your phone for a bigger view</div>
<div id="tc"><div id="pad"><span class="l">◀</span><span class="r">▶</span></div><button id="bj">▲</button></div>
<script type="module" src="/src/main.ts"></script></body></html>
